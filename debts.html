<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debts</title>

<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #21252e;
    --accent: #ff8a3d;
    --accent-soft: #3a2a1e;
    --text: #eceef2;
    --text-dim: #9aa0ab;
    --border: #2a2e38;
    --danger: #e5484d;
    --success: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 720px; padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .subtitle { margin-bottom: 8px; color: var(--text-dim); font-size: 14px; }
  .dashboard-link { display: inline-block; margin-bottom: 16px; color: var(--accent); font-size: 13px; text-decoration: none; }
  .dashboard-link:hover { text-decoration: underline; }
  .sync-status { min-height: 18px; margin-bottom: 14px; color: var(--text-dim); font-size: 12px; }
  .sync-status.success { color: var(--success); }
  .sync-status.error { color: #ff8a8f; }
  .storage-warning {
    display: none; margin-bottom: 16px; padding: 12px 14px;
    border: 1px solid var(--danger); border-radius: 10px;
    background: rgba(229, 72, 77, 0.15); color: #ff8a8f; font-size: 13px; line-height: 1.4;
  }
  .storage-warning.show { display: block; }
  .card, .auth-card {
    margin-bottom: 16px; padding: 16px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--card);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-row.full { grid-template-columns: 1fr; }
  label { display: block; margin-bottom: 4px; color: var(--text-dim); font-size: 12px; }
  input, select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    outline: none; background: #12141a; color: var(--text); font-size: 14px;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 10px 16px; border: none; border-radius: 8px;
    background: var(--accent); color: #1a1005; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    width: auto; border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  }
  .auth-header { margin-bottom: 12px; color: var(--text-dim); font-size: 14px; font-weight: 600; }
  .auth-link {
    display: block; margin-top: 10px; color: var(--accent); cursor: pointer;
    font-size: 12px; text-align: center; text-decoration: underline;
  }
  .auth-user-info { color: var(--text); font-size: 13px; }
  .auth-user-info span { color: var(--accent); font-weight: 600; }
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { padding: 12px; border-radius: 8px; background: #12141a; text-align: center; }
  .stat-value { color: var(--accent); font-size: 20px; font-weight: 700; }
  .stat-value.danger { color: var(--danger); }
  .stat-value.success { color: var(--success); }
  .stat-label { margin-top: 2px; color: var(--text-dim); font-size: 11px; }

  .priority-banner {
    margin-bottom: 16px;
    padding: 14px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent-soft), var(--card));
    border: 1px solid var(--accent);
    font-size: 13px;
  }
  .priority-banner strong { color: var(--accent); }

  .debt-card {
    margin-bottom: 12px; padding: 14px; border-radius: 10px;
    background: #12141a; border-left: 3px solid var(--danger);
  }
  .debt-card.done { border-left-color: var(--success); opacity: 0.75; }
  .debt-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .debt-name { font-size: 15px; font-weight: 700; }
  .debt-name.done-text { text-decoration: line-through; }
  .debt-amounts { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .debt-amounts .paid { color: var(--success); font-weight: 600; }
  .debt-amounts .owed { color: var(--danger); font-weight: 600; }
  .progress-bar-bg { width: 100%; height: 10px; border-radius: 6px; background: #21252e; overflow: hidden; margin-bottom: 10px; }
  .progress-bar-fill { height: 100%; border-radius: 6px; background: var(--success); transition: width 0.3s; }
  .debt-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .debt-meta .rate { color: var(--danger); font-weight: 600; }
  .debt-actions { display: flex; gap: 8px; }
  .debt-actions input { flex: 1; }
  .debt-actions button { width: auto; padding: 8px 12px; font-size: 13px; }
  .del-btn { width: auto; padding: 4px 8px; background: none; color: var(--danger); font-size: 17px; }
  .empty-state { padding: 30px 10px; color: var(--text-dim); font-size: 14px; text-align: center; }
  .toast {
    position: fixed; z-index: 9999; bottom: 20px; left: 50%; padding: 10px 18px;
    border: 1px solid var(--accent); border-radius: 20px; background: var(--card);
    font-size: 13px; opacity: 0; pointer-events: none; transform: translateX(-50%); transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }
</style>
</head>

<body>

<h1>💳 Debts</h1>
<div class="subtitle">Track balances and pay them down.</div>

<a href="/" class="dashboard-link">← Back to Dashboard</a>

<div class="sync-status" id="syncStatus">Checking cloud connection…</div>

<div class="storage-warning" id="storageWarning">
  ⚠️ <strong>Saving is not available on this device.</strong>
  Use a normal browser tab instead of private/incognito mode.
</div>

<div class="auth-card">
  <div id="loggedOutForm">
    <div class="auth-header" id="authTitle">Sign in to sync your debts</div>
    <div class="form-row">
      <div>
        <label for="authUsername">Username</label>
        <input id="authUsername" type="text" placeholder="e.g. benjamin" autocomplete="username">
      </div>
      <div>
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>
    <div style="margin-top:12px;">
      <button id="authBtn" onclick="handleAuth()">Login</button>
    </div>
    <span class="auth-link" id="authToggle" onclick="toggleAuthMode()">Don't have an account? Sign up</span>
  </div>
  <div id="loggedInView" style="display:none; align-items:center; justify-content:space-between;">
    <div class="auth-user-info">Cloud synced: <span id="userDisplay"></span></div>
    <button class="secondary" onclick="handleLogout()" style="padding:6px 12px; font-size:12px;">Logout</button>
  </div>
</div>

<div class="card">
  <div class="form-row">
    <div>
      <label for="debtName">Debt name</label>
      <input id="debtName" placeholder="e.g. Credit card, Car loan, Phone plan owed">
    </div>
    <div>
      <label for="debtOriginal">Original amount owed ($)</label>
      <input id="debtOriginal" type="number" min="0.01" step="0.01" placeholder="e.g. 1200">
    </div>
  </div>
  <div class="form-row">
    <div>
      <label for="debtPaid">Already paid off ($, optional)</label>
      <input id="debtPaid" type="number" min="0" step="0.01" placeholder="0">
    </div>
    <div>
      <label for="debtRate">Interest rate (%, optional)</label>
      <input id="debtRate" type="number" min="0" step="0.01" placeholder="e.g. 24.99">
    </div>
  </div>
  <div class="form-row">
    <div>
      <label for="debtMinPayment">Minimum payment ($/mo, optional)</label>
      <input id="debtMinPayment" type="number" min="0" step="0.01" placeholder="e.g. 35">
    </div>
    <div>
      <label for="debtDue">Payoff target date (optional)</label>
      <input id="debtDue" type="date">
    </div>
  </div>
  <button onclick="addDebt()">+ Add Debt</button>
</div>

<div class="card">
  <div class="summary-grid" id="summary"></div>
</div>

<div id="priorityBanner"></div>

<div id="debtList"></div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCzs8NliIcPQ76GxzBwDQR26vuMFG07IGU",
    authDomain: "scheduler-609b0.firebaseapp.com",
    projectId: "scheduler-609b0",
    storageBucket: "scheduler-609b0.firebasestorage.app",
    messagingSenderId: "151764758872",
    appId: "1:151764758872:web:4382212aaa6e870395b52d",
    measurementId: "G-MX8DN7YLB2"
  };

  const app = initializeApp(firebaseConfig);
  try { getAnalytics(app); } catch (e) { console.warn("Analytics bypassed.", e); }

  const auth = getAuth(app);
  const db = getFirestore(app);

  const STORAGE_KEY = "benjamin-debts-tracker-data";

  let currentUser = null;
  let unsubscribeDebts = null;
  let isSignUpMode = false;
  let storageWorking = true;

  let data = { debts: [] };

  function usernameToEmail(username) {
    const clean = username.toLowerCase().trim().replace(/[^a-z0-9_.-]/g, "");
    return `${clean}@scheduler.app`;
  }
  function emailToUsername(email) { return email ? email.split("@")[0] : ""; }

  // Registers this user in the shared directory on login, so admins can
  // find and grant/hide anyone — not just people who've saved a debt.
  async function registerInDirectory(user) {
    try {
      await setDoc(doc(db, "directory", user.uid), {
        username: emailToUsername(user.email),
        updatedAt: Date.now()
      }, { merge: true });
    } catch (e) {
      console.error("Could not register in directory:", e);
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function setSyncStatus(message, type = "") {
    const status = document.getElementById("syncStatus");
    status.textContent = message;
    status.className = `sync-status ${type}`;
  }

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  }

  async function checkStorage() {
    const warning = document.getElementById("storageWarning");
    try {
      localStorage.setItem("__debts_probe__", "ok");
      const check = localStorage.getItem("__debts_probe__");
      localStorage.removeItem("__debts_probe__");
      storageWorking = check === "ok";
      if (!storageWorking) warning.classList.add("show");
    } catch (e) {
      storageWorking = false;
      warning.classList.add("show");
    }
  }

  function loadLocalData() {
    if (!storageWorking) return;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        data = { debts: Array.isArray(parsed.debts) ? parsed.debts : [] };
      }
    } catch (e) { console.warn("Could not load local debts.", e); }
  }

  function saveLocalData() {
    if (!storageWorking) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch (e) { console.warn("Could not save local debts.", e); }
  }

  function getDebtsDocRef() {
    if (!currentUser) return null;
    return doc(db, "debts", currentUser.uid);
  }

  async function saveCloudData() {
    if (!currentUser) {
      setSyncStatus("Saved only on this device. Sign in to sync to cloud.");
      return true;
    }
    const ref = getDebtsDocRef();
    if (!ref) return false;
    try {
      setSyncStatus("Saving debts to cloud…");
      await setDoc(ref, { debts: data.debts || [], updatedAt: Date.now() });
      setSyncStatus("✓ Debts saved and synced to Firebase.", "success");
      return true;
    } catch (e) {
      console.error("Cloud debt save failed:", e);
      setSyncStatus("Cloud save failed. Saved locally. Check Firestore rules.", "error");
      return false;
    }
  }

  async function saveData() {
    saveLocalData();
    return saveCloudData();
  }

  function startDebtsListener() {
    if (!currentUser) return;
    if (unsubscribeDebts) { unsubscribeDebts(); unsubscribeDebts = null; }
    const ref = getDebtsDocRef();
    unsubscribeDebts = onSnapshot(ref, snapshot => {
      if (snapshot.exists()) {
        const cloud = snapshot.data();
        data = { debts: Array.isArray(cloud.debts) ? cloud.debts : [] };
        saveLocalData();
        setSyncStatus("✓ Debts loaded from Firebase.", "success");
      } else if ((data.debts || []).length > 0) {
        saveCloudData();
      } else {
        setSyncStatus("Ready to save debts to Firebase.", "success");
      }
      render();
    }, error => {
      console.error("Debts listener failed:", error);
      setSyncStatus("Firebase cannot load debts. Check Firestore rules.", "error");
    });
  }

  async function addDebt() {
    const name = document.getElementById("debtName").value.trim();
    const original = parseFloat(document.getElementById("debtOriginal").value);
    const paidInput = document.getElementById("debtPaid").value;
    const rateInput = document.getElementById("debtRate").value;
    const minPaymentInput = document.getElementById("debtMinPayment").value;
    const due = document.getElementById("debtDue").value;
    const paid = paidInput ? parseFloat(paidInput) : 0;

    if (!name || isNaN(original) || original <= 0) {
      showToast("Enter a debt name and a valid original amount");
      return;
    }

    data.debts.push({
      id: Date.now(),
      name,
      originalAmount: original,
      paidAmount: isNaN(paid) ? 0 : paid,
      interestRate: rateInput ? parseFloat(rateInput) : null,
      minPayment: minPaymentInput ? parseFloat(minPaymentInput) : null,
      dueDate: due || null,
      done: false
    });

    await saveData();
    document.getElementById("debtName").value = "";
    document.getElementById("debtOriginal").value = "";
    document.getElementById("debtPaid").value = "";
    document.getElementById("debtRate").value = "";
    document.getElementById("debtMinPayment").value = "";
    document.getElementById("debtDue").value = "";
    render();
    showToast("Debt added ✓");
  }

  async function addPayment(id) {
    const input = document.getElementById(`payment-${id}`);
    const amount = parseFloat(input.value);
    if (isNaN(amount) || amount <= 0) {
      showToast("Enter a valid payment amount");
      return;
    }
    const debt = data.debts.find(d => d.id === id);
    if (!debt) return;
    debt.paidAmount = (Number(debt.paidAmount) || 0) + amount;
    if (debt.paidAmount >= debt.originalAmount) debt.done = true;
    await saveData();
    render();
    showToast(`Logged $${amount.toFixed(2)} payment ✓`);
  }

  async function toggleDone(id) {
    const debt = data.debts.find(d => d.id === id);
    if (!debt) return;
    debt.done = !debt.done;
    await saveData();
    render();
  }

  async function deleteDebt(id) {
    data.debts = data.debts.filter(d => d.id !== id);
    await saveData();
    render();
  }

  function formatDate(dateString) {
    if (!dateString) return null;
    const date = new Date(`${dateString}T00:00:00`);
    return date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }

  function render() {
    const debts = data.debts || [];
    const totalOriginal = debts.reduce((s, d) => s + (Number(d.originalAmount) || 0), 0);
    const totalPaid = debts.reduce((s, d) => s + Math.min(Number(d.paidAmount) || 0, Number(d.originalAmount) || 0), 0);
    const totalOwed = totalOriginal - totalPaid;
    const activeCount = debts.filter(d => !d.done).length;
    const doneCount = debts.filter(d => d.done).length;

    document.getElementById("summary").innerHTML = `
      <div class="stat">
        <div class="stat-value danger">$${totalOwed.toFixed(0)}</div>
        <div class="stat-label">Total Owed</div>
      </div>
      <div class="stat">
        <div class="stat-value success">$${totalPaid.toFixed(0)}</div>
        <div class="stat-label">Total Paid Off</div>
      </div>
      <div class="stat">
        <div class="stat-value">${activeCount}</div>
        <div class="stat-label">Active Debts</div>
      </div>
      <div class="stat">
        <div class="stat-value">${doneCount}</div>
        <div class="stat-label">Paid Off</div>
      </div>
    `;

    const bannerEl = document.getElementById("priorityBanner");
    const activeDebts = debts.filter(d => !d.done && (Number(d.originalAmount) - Number(d.paidAmount)) > 0);
    const withRate = activeDebts.filter(d => d.interestRate != null);
    if (withRate.length > 0) {
      const highest = withRate.reduce((a, b) => Number(b.interestRate) > Number(a.interestRate) ? b : a);
      bannerEl.innerHTML = `
        <div class="priority-banner">
          💡 <strong>${escapeHtml(highest.name)}</strong> has your highest interest rate (${Number(highest.interestRate).toFixed(2)}%) — paying extra there first typically saves the most money.
        </div>
      `;
    } else {
      bannerEl.innerHTML = "";
    }

    const listEl = document.getElementById("debtList");
    if (!debts.length) {
      listEl.innerHTML = `<div class="card"><div class="empty-state">No debts added yet. Add one above to start tracking payoff progress.</div></div>`;
      return;
    }

    const sorted = debts.slice().sort((a, b) => (a.done === b.done) ? 0 : a.done ? 1 : -1);

    listEl.innerHTML = sorted.map(debt => {
      const remaining = Math.max(0, Number(debt.originalAmount) - Number(debt.paidAmount));
      const pct = debt.originalAmount > 0 ? Math.min(100, (debt.paidAmount / debt.originalAmount) * 100) : 0;
      const dueLabel = formatDate(debt.dueDate);
      return `
        <div class="debt-card ${debt.done ? "done" : ""}">
          <div class="debt-top">
            <div class="debt-name ${debt.done ? "done-text" : ""}">${escapeHtml(debt.name)}</div>
            <button class="del-btn" onclick="deleteDebt(${debt.id})">✕</button>
          </div>
          <div class="debt-amounts">
            <span class="paid">$${(Number(debt.paidAmount) || 0).toFixed(2)}</span> paid of
            <span class="owed">$${(Number(debt.originalAmount) || 0).toFixed(2)}</span>
            (${pct.toFixed(0)}%)
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width:${pct}%"></div>
          </div>
          <div class="debt-meta">
            ${debt.done ? "🎉 Fully paid off!" : `$${remaining.toFixed(2)} left to pay`}
            ${debt.interestRate != null ? ` · <span class="rate">${Number(debt.interestRate).toFixed(2)}% interest</span>` : ""}
            ${debt.minPayment != null ? ` · $${Number(debt.minPayment).toFixed(2)}/mo minimum` : ""}
            ${dueLabel ? ` · Target: ${dueLabel}` : ""}
          </div>
          ${!debt.done ? `
            <div class="debt-actions">
              <input id="payment-${debt.id}" type="number" min="0.01" step="0.01" placeholder="Log a payment ($)">
              <button onclick="addPayment(${debt.id})">Pay</button>
            </div>
          ` : `
            <button class="secondary" onclick="toggleDone(${debt.id})">Mark as not paid off</button>
          `}
        </div>
      `;
    }).join("");
  }

  async function handleAuth() {
    const username = document.getElementById("authUsername").value.trim();
    const password = document.getElementById("authPassword").value;
    if (!username || !password) { showToast("Enter a username and password"); return; }
    if (username.length < 3) { showToast("Username must be at least 3 characters"); return; }
    const email = usernameToEmail(username);
    try {
      if (isSignUpMode) {
        await createUserWithEmailAndPassword(auth, email, password);
        showToast("Account created!");
      } else {
        await signInWithEmailAndPassword(auth, email, password);
        showToast("Welcome back!");
      }
    } catch (error) {
      console.error("Authentication error:", error);
      const code = error.code || "";
      let message = "Could not sign in.";
      if (code === "auth/invalid-credential" || code === "auth/user-not-found" || code === "auth/wrong-password") {
        message = "Invalid username or password";
      } else if (code === "auth/email-already-in-use") {
        message = "Username already taken";
      } else if (code === "auth/weak-password") {
        message = "Password must be at least 6 characters";
      }
      showToast(message);
    }
  }

  async function handleLogout() {
    try {
      if (unsubscribeDebts) { unsubscribeDebts(); unsubscribeDebts = null; }
      await signOut(auth);
      currentUser = null;
      loadLocalData();
      render();
      setSyncStatus("Showing debts saved on this device.");
      showToast("Logged out");
    } catch (error) {
      console.error("Logout error:", error);
      showToast("Failed to log out");
    }
  }

  function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    const title = document.getElementById("authTitle");
    const button = document.getElementById("authBtn");
    const toggle = document.getElementById("authToggle");
    if (isSignUpMode) {
      title.textContent = "Create an account to sync your debts";
      button.textContent = "Sign Up";
      toggle.textContent = "Already have an account? Sign in";
    } else {
      title.textContent = "Sign in to sync your debts";
      button.textContent = "Login";
      toggle.textContent = "Don't have an account? Sign up";
    }
  }

  onAuthStateChanged(auth, user => {
    currentUser = user;
    const loggedOutForm = document.getElementById("loggedOutForm");
    const loggedInView = document.getElementById("loggedInView");
    const userDisplay = document.getElementById("userDisplay");

    if (user) {
      loggedOutForm.style.display = "none";
      loggedInView.style.display = "flex";
      userDisplay.textContent = emailToUsername(user.email);
      loadLocalData();
      startDebtsListener();
      registerInDirectory(user);
      render();
      return;
    }

    loggedOutForm.style.display = "block";
    loggedInView.style.display = "none";
    loadLocalData();
    setSyncStatus("Sign in to sync debts to Firebase.");
    render();
  });

  window.handleAuth = handleAuth;
  window.handleLogout = handleLogout;
  window.toggleAuthMode = toggleAuthMode;
  window.addDebt = addDebt;
  window.addPayment = addPayment;
  window.toggleDone = toggleDone;
  window.deleteDebt = deleteDebt;

  (async () => {
    await checkStorage();
    loadLocalData();
    render();
  })();
</script>

</body>
</html>
